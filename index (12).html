<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<title>Ward Zero – Hospital-at-Home</title>
<style>
:root{--bg:#0a1020;--panel:#111a30;--panel2:#16213d;--line:#243252;--tx:#e8eefc;--mut:#8fa0c4;--acc:#22c5c5;--ok:#2fbf71;--warn:#e6a817;--hi:#f07a2a;--crit:#e5484d;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f2f5fb;--panel:#fff;--panel2:#eef2fa;--line:#d5dcec;--tx:#0f1a33;--mut:#5a6a8c;color-scheme:light}}
:root[data-theme="light"]{--bg:#f2f5fb;--panel:#fff;--panel2:#eef2fa;--line:#d5dcec;--tx:#0f1a33;--mut:#5a6a8c;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{font-size:20px;font-weight:700;padding:4px 10px 4px}.logo small{display:block;font-size:10px;letter-spacing:.12em;color:var(--acc)}
nav{display:flex;flex-direction:column;gap:4px;margin-top:18px}
nav button{all:unset;cursor:pointer;padding:10px 12px;border-radius:9px;color:var(--mut);font-weight:500}
nav button:hover{background:var(--panel2);color:var(--tx)}nav button.on{background:var(--panel2);color:var(--tx);box-shadow:inset 3px 0 var(--acc)}
main{min-width:0}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:12px 24px;border-bottom:1px solid var(--line);background:var(--panel)}
.clock{font-weight:700;font-size:17px}.clock small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
select,input,.btn{background:var(--panel2);color:var(--tx);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font:inherit}
.btn{cursor:pointer;font-weight:600}.btn:hover{border-color:var(--acc)}.btn.p{background:var(--acc);color:#04202a;border-color:var(--acc)}
.tour{display:none;align-items:center;gap:14px;padding:10px 24px;background:linear-gradient(90deg,#0f3d44,#17304f);border-bottom:1px solid var(--line)}
.tour.on{display:flex}.dots{display:flex;gap:5px}.dots i{width:22px;height:5px;border-radius:3px;background:#ffffff33}.dots i.d{background:var(--acc)}
.alert{display:none;padding:12px 24px;background:#4a1519;border-bottom:2px solid var(--crit);align-items:center;justify-content:space-between;gap:12px}.alert.on{display:flex}
.pg{padding:24px;max-width:1250px}
h1{font-size:26px;margin:0 0 6px}h2{font-size:20px;margin:26px 0 10px}p.s{color:var(--mut);margin:0 0 16px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.badge{font-size:11px;font-weight:800;letter-spacing:.06em;padding:4px 10px;border-radius:6px;color:#fff}
.STABLE{background:var(--ok)}.MODERATE{background:var(--warn)}.HIGH{background:var(--hi)}.CRITICAL{background:var(--crit)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 18px}.chip{cursor:pointer;border-radius:20px}.chip.on{border-color:var(--acc);color:var(--acc)}
.vit{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;border:1px solid var(--line);border-radius:10px;padding:10px;margin:10px 0;background:var(--bg)}
.vit span{display:block;font-size:10px;color:var(--mut);letter-spacing:.05em}.vit b{font-size:20px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.mut{color:var(--mut);font-size:13px}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px}
.hero h1{font-size:38px;line-height:1.1}.hero h1 em{color:#3b7bff;font-style:normal;display:block}
.ecg{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px}
.flag{border-left:3px solid var(--crit);background:var(--panel2);padding:10px 12px;border-radius:8px;font-size:13px;margin:12px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-top:18px}.stats b{font-size:28px;display:block}
table{width:100%;border-collapse:collapse}td,th{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
.ecgw{overflow:hidden}.ecgw svg{width:200%;display:block;animation:sw linear infinite}@keyframes sw{to{transform:translateX(-50%)}}.g4{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.big{font-size:34px;font-weight:700}.ph{border:6px solid var(--line);border-radius:36px;min-height:340px;padding:14px;background:var(--bg)}.k{background:var(--panel2);border-radius:10px;padding:10px}.k b{font-size:24px;display:block}.ow{overflow-x:auto}.g4f{display:grid;gap:16px;grid-template-columns:repeat(4,1fr)}.g5f{display:grid;gap:16px;grid-template-columns:repeat(5,1fr)}.g4f .card,.g5f .card{height:100%;padding:20px}.g4f .card{border-top:3px solid var(--crit)}.g5f .card{border-top:3px solid var(--acc)}.g4f .card b{font-size:17px}@media(max-width:1100px){.g4f,.g5f{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.g4f,.g5f{grid-template-columns:1fr}}.ac{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:12px;padding:12px;margin-top:10px;font-size:14px}.ac ul{padding-left:18px;margin:6px 0}.pb{height:5px;background:var(--line);border-radius:3px}.pb i{display:block;height:100%;background:var(--warn);border-radius:3px}.INFO{background:#2ab4f0;color:#04202a}.chp{display:inline-block;font-size:12px;background:var(--panel2);border-radius:6px;padding:3px 8px;margin:2px 4px 2px 0}.chg{background:#1d4d35;color:#7be0a8}.chr{background:#4a1a1d;color:#ff9a9d}button:disabled{opacity:.5;cursor:default}.ac{word-break:break-word}@media(max-width:860px){.grid[style*='330px']{grid-template-columns:1fr!important}.ph{min-height:0}}
@media(max-width:860px){.app{grid-template-columns:1fr}aside{position:static;height:auto}nav{flex-direction:row;flex-wrap:wrap}.hero{grid-template-columns:1fr}.pg{padding:14px}}
</style></head><body>
<div class="app">
<aside><div class="logo">🛏 Ward Zero<small>HOSPITAL-AT-HOME</small></div><nav id="nav"></nav></aside>
<main>
<div class="top">
 <div class="clock" id="clk">—<small>IST (India Standard Time)</small></div>
 <div class="ctl">
  <button class="btn p" id="ref">⟳ Refresh patients</button>
  <button class="btn" id="judge">▶ Judge Mode</button>
  <button class="btn" id="snd" title="Alert sound">🔊</button>
  <button class="btn" id="thm" title="Switch light / dark">☀/🌙</button>
  <label class="mut">Acting as <select id="doc"></select></label>
 </div>
</div>
<div class="tour" id="tour"><div class="dots" id="dots"></div><span id="stp"></span><button class="btn" id="stop" style="margin-left:auto">Stop Tour</button></div>
<div class="alert" id="alert"><span id="altx"></span><button class="btn" id="ack">Acknowledge</button></div>
<div class="pg" id="pg"></div>
</main></div>
<script>
const TABS=['Home','Doctor Ward','Patient Deep-Dive','Caregiver Portal','Simulation Lab','Audit Trail','Risk Model Card','Safety & Limits'];
const DOCS=['Dr. Meera Sen (Chief of Virtual Care, Intensivist)','Dr. Arjun Rao (Cardiologist)','Dr. Nisha Patel (Pulmonologist)'];
const NAMES=['Lakshmi','Rajesh Kumar','Fatima Begum','Anand Mohan','Elena Rostova','Suresh Babu','Meena Iyer','Karthik Raja','Zainab Khan','Vikram Singh','Divya Nair','Gopal Das','Sunita Devi','Imran Sheikh','Revathi S','Joseph Mathew','Pooja Verma','Harish Menon','Ayesha Siddiqui','Balaji R','Nandini Rao','Tariq Ahmed','Geeta Pillai','Mohan Lal'];
const DX=['Post-CABG cardiac recovery','Severe COPD with home oxygen','Pneumonia recovery','Heart failure (NYHA II)','Post-sepsis monitoring','Diabetic foot infection','Post-hip replacement','Acute bronchitis','Atrial fibrillation','Post-stroke rehab'];
const CG=['Priya (daughter)','Arun (son)','Kavita (spouse)','Sanjay (brother)','Rohan (son)','Anita (wife)','Deepa (daughter)'];
const R=(a,b)=>Math.floor(a+Math.random()*(b-a+1)),P=a=>a[R(0,a.length-1)];
let pts=[],log=[],tab=0,sel=null,flt='All',q='',tourT=null,acked={};
function score(p){let s=0;const o=p.spo2,h=p.hr,t=p.temp,b=p.sys;
 s+=o>=96?0:o>=94?1:o>=92?2:3; s+=h<=40?3:h<=50?1:h<=90?0:h<=110?1:h<=130?2:3;
 s+=t<=35?3:t<=36?1:t<=38?0:t<=39?1:2; s+=b<=90?3:b<=100?2:b<=110?1:b<=219?0:3;return s}
function stat(s){return s>=7?'CRITICAL':s>=5?'HIGH':s>=3?'MODERATE':'STABLE'}
function why(p){const w=[];if(p.hr>100)w.push(`HR ${p.hr} BPM above threshold 100`);if(p.spo2<93)w.push(`SpO₂ ${p.spo2}% below threshold 93%`);if(p.temp>38)w.push(`Temp ${p.temp}°C above 38.0°C`);if(p.sys<100)w.push(`SBP ${p.sys} below 100`);return w.length?w.join('; '):'All parameters within illustrative limits'}
function mk(i,sev){const s=sev??Math.pow(Math.random(),1.8);const p={id:'WZ-'+(101+i),name:NAMES[i%NAMES.length],age:R(34,86),sex:Math.random()<.5?'Male':'Female',bed:'Bedroom-'+R(1,6)+P(['A','B']),dx:P(DX),doc:P(DOCS).split(' (')[0],cg1:P(CG),cg2:P(CG),
 hr:Math.round(72+s*58+R(-4,4)),spo2:Math.round(98-s*9-R(0,1)),temp:+(36.6+s*2.3+Math.random()*.3).toFixed(1),sys:Math.round(128-s*38+R(-4,4))};p.dia=Math.round(p.sys*.63+R(-3,3));p.hist=Array.from({length:14},()=>p.hr+R(-6,6));fin(p);return p}
function fin(p){p.news=score(p);p.status=stat(p.news);p.risk=Math.min(97,Math.round(p.news*p.news*1.4+R(0,3)))}
function gen(){const n=R(6,16),names=[...NAMES].sort(()=>Math.random()-.5);pts=Array.from({length:n},(_,i)=>{const p=mk(i);p.name=names[i];return p});
 if(Math.random()<.7){const k=R(1,Math.min(3,n));for(let i=0;i<k;i++){const p=pts[R(0,n-1)];Object.assign(p,{hr:R(112,128),spo2:R(88,91),temp:+(38.2+Math.random()*.8).toFixed(1),sys:R(92,104)});p.dia=R(58,70);fin(p)}}
 pts.sort((a,b)=>b.news-a.news);addLog(`Roster refreshed: ${n} patients generated`);}
function sha256(str){const b=new TextEncoder().encode(str),l=b.length,n=((l+9+63)>>6)<<6,m=new Uint8Array(n);m.set(b);m[l]=128;const dv=new DataView(m.buffer);dv.setUint32(n-8,Math.floor(l*8/4294967296));dv.setUint32(n-4,(l*8)>>>0);const K=[],H=[];let c=0;for(let p=2;c<64;p++){let pr=1;for(let d=2;d*d<=p;d++)if(p%d==0){pr=0;break}if(pr){K[c]=Math.floor((Math.cbrt(p)%1)*4294967296);if(c<8)H[c]=Math.floor((Math.sqrt(p)%1)*4294967296);c++}}const W=new Uint32Array(64),rr=(x,k)=>(x>>>k)|(x<<(32-k));for(let o=0;o<n;o+=64){for(let i=0;i<16;i++)W[i]=dv.getUint32(o+i*4);for(let i=16;i<64;i++){const a=W[i-15],d=W[i-2];W[i]=(W[i-16]+(rr(a,7)^rr(a,18)^(a>>>3))+W[i-7]+(rr(d,17)^rr(d,19)^(d>>>10)))>>>0}let[a,b2,c2,d2,e,f,g,h]=H;for(let i=0;i<64;i++){const t1=(h+(rr(e,6)^rr(e,11)^rr(e,25))+((e&f)^(~e&g))+K[i]+W[i])>>>0,t2=((rr(a,2)^rr(a,13)^rr(a,22))+((a&b2)^(a&c2)^(b2&c2)))>>>0;h=g;g=f;f=e;e=(d2+t1)>>>0;d2=c2;c2=b2;b2=a;a=(t1+t2)>>>0}[a,b2,c2,d2,e,f,g,h].forEach((v,i)=>H[i]=(H[i]+v)>>>0)}return H.map(v=>v.toString(16).padStart(8,'0')).join('')}
var GEN='0'.repeat(64);function hh(s){return sha256(s)}function hc(prev,t,p,a,x,m){return hh([prev,t,p,a,x,m].join('|'))}
let ctx=null,snd=true,sirenT=null;
document.addEventListener('click',()=>{try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume()}catch(e){}});
function beep(f){if(!ctx||!snd)return;const o=ctx.createOscillator(),g=ctx.createGain();o.type='square';o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.3)}
function siren(on){clearInterval(sirenT);sirenT=null;if(on){let k=0;beep(880);sirenT=setInterval(()=>beep(k++%2?880:660),400)}}
function theme(){const r=document.documentElement,l=r.dataset.theme?r.dataset.theme=='light':matchMedia('(prefers-color-scheme: light)').matches;r.dataset.theme=l?'dark':'light'}
function now(){return new Date().toLocaleString('en-GB',{timeZone:'Asia/Kolkata',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false})+' IST'}
function ecg(){let d='M0 40',x=0;while(x<520){d+=` L${x+14} 40 L${x+20} 34 L${x+26} 40 L${x+40} 40 L${x+44} 46 L${x+50} 6 L${x+56} 60 L${x+60} 40 L${x+80} 40 L${x+90} 30 L${x+100} 40`;x+=110}return `<svg viewBox="0 0 520 70" width="100%" height="80"><path d="${d}" fill="none" stroke="#2fd6a0" stroke-width="2"/></svg>`}
function spark(a){const m=Math.min(...a),M=Math.max(...a),pt=a.map((v,i)=>`${i*40},${70-(v-m)/(M-m||1)*60}`).join(' ');return `<svg viewBox="0 0 520 80" width="100%" height="90"><polyline points="${pt}" fill="none" stroke="#22c5c5" stroke-width="2.5"/></svg>`}
function vit(p){return `<div class="vit"><div><span>TEMP</span><b>${p.temp}°C</b></div><div><span>HEART RATE</span><b>${p.hr}</b></div><div><span>BLOOD PRESS.</span><b>${p.sys}/${p.dia}</b></div><div><span>SPO₂</span><b>${p.spo2}%</b></div></div>`}
function card(p){return `<div class="card"><div class="row"><b style="font-size:19px">${p.name}</b><span class="badge ${p.status}">${p.status}</span></div><div class="mut">${p.id} · ${p.age} y · ${p.sex} · ${p.bed}</div><div style="margin-top:6px"><b>Diagnosis:</b> ${p.dx}</div><div class="mut">Doctor: <b>${p.doc}</b> · Primary CG: <b>${p.cg1}</b> · Secondary: <b>${p.cg2}</b></div>${vit(p)}<div class="row"><span>NEWS2: <b>${p.news}</b> · 24–48h Risk: <b>${p.risk}%</b></span><button class="btn p" onclick="go(${pts.indexOf(p)})">View Deep-Dive →</button></div></div>`}
function go(i){sel=i;tab=2;render()}
const V={
0(){const f=[...pts].sort((a,b)=>b.news-a.news)[0],c=pts.filter(p=>p.status=='CRITICAL').length;return `<div class="hero"><div><div class="mut" style="letter-spacing:.1em;font-size:12px">CONTINUOUS HOSPITAL-AT-HOME PATIENT CARE PLATFORM</div><h1>Hospital-Grade Awareness.<em>Right at Home.</em></h1><p class="s">Patient vitals, explainable risk insights and caregiver response in one continuous monitoring experience.</p><button class="btn p" onclick="tab=1;render()">Explore Live Demo</button> <button class="btn" onclick="tab=4;render()">Simulation Lab</button></div>
<div class="card"><div class="row"><div><b style="font-size:18px">${f.name}</b><div class="mut">${f.bed} · ID #${f.id}</div></div><span class="badge ${f.status}">${f.status=='CRITICAL'?'CRITICAL REVIEW':f.status}</span></div><div class="ecg" style="margin-top:10px"><div class="mut" style="font-size:11px">LEAD-II CARDIAC RHYTHM · ${f.hr} BPM (simulated)</div>${ecg(f.hr,f.status)}</div>${vit(f)}<div class="flag" style="border-color:var(${f.status=='STABLE'?'--ok':'--crit'})"><b>Risk Intelligence Flag:</b> ${f.status=='CRITICAL'?'URGENT FOLLOW-UP REQUIRED':f.status}<br>${why(f)}</div><button class="btn" onclick="go(${pts.indexOf(f)})">Review Patient</button></div></div>
<div class="stats"><div class="card mut">PATIENTS MONITORED<b>${pts.length}</b></div><div class="card mut">CRITICAL NOW<b style="color:var(--crit)">${c}</b></div><div class="card mut">CONNECTED SENSORS<b>${pts.length*4}</b></div><div class="card mut">ESCALATION ACK RATE<b>98.4%</b></div></div>
<h2 style="text-align:center;margin-top:44px">Why Existing Home Monitoring Fails</h2><p class="s" style="text-align:center">Standard patient monitors moved into home bedrooms cause serious clinical and operational failure modes that WardZero solves directly.</p><div class="g4f">${[['1. Hospital Bed Crises','Acute wards overflow with convalescing patients who could recover safely at home with guaranteed monitoring.'],['2. The Alarm Fatigue Trap','Fixed-threshold monitors give 85–99% false alarms (e.g. SpO₂ &lt; 95% on a COPD patient).'],['3. Silence = Safety Fallacy','When a probe slips or Wi-Fi drops, legacy monitors fall silent and caregivers assume safety.'],['4. Unanswered Alarms','No forced acknowledgement, no escalation when the caregiver sleeps, no audit record.']].map(x=>`<div class="card"><b>${x[0]}</b><p class="mut">${x[1]}</p></div>`).join('')}</div>
<h2 style="text-align:center;margin-top:44px">The WARDZERO Primary Workflow</h2><p class="s" style="text-align:center">A continuous, clinically grounded pipeline built for safety, rapid response, and zero silent failures.</p><div class="g5f">${[['SENSE','BLE/Zigbee patches collect HR, SpO₂, skin temperature.'],['UNDERSTAND','Bedroom hub validates freshness and filters motion artifacts.'],['PREDICT','Multi-parameter rule engine evaluates trends.'],['ALERT','Flags with contributing factors go to caregiver consoles.'],['RESPOND','Caregiver confirms action or auto-escalates to the doctor.']].map((x,i)=>`<div class="card"><span class="mut" style="color:#3b7bff">STEP 0${i+1}</span><br><b>${x[0]}</b><p class="mut">${x[1]}</p></div>`).join('')}</div>`},
1(){const cnt=s=>pts.filter(p=>p.status==s).length,L=[...pts].sort((a,b)=>b.news-a.news).filter(p=>(flt=='All'||p.status==String(flt||'').toUpperCase())&&(p.name+p.bed+p.dx).toLowerCase().includes(q));
 return `<h1>Doctor Ward Overview</h1><p class="s">Multi-patient hospital-at-home roster, sorted by clinical urgency (Critical first).</p><div class="chips"><input id="q" placeholder="Search patient, room, diagnosis…" value="${q}">${['All','Critical','High','Moderate','Stable'].map(f=>`<button class="btn chip ${flt==f?'on':''}" onclick="flt='${f}';render()">${f} (${f=='All'?pts.length:cnt(f=='High'?'HIGH':String(f||'').toUpperCase())})</button>`).join('')}</div><div class="grid">${L.map(card).join('')||'<p class="mut">No matches.</p>'}</div>`},
2(){const p=pts[sel??0]||pts[0];return `<h1>Patient Deep-Dive</h1><p class="s"><select onchange="sel=+this.value;render()">${pts.map((x,i)=>`<option value="${i}" ${x==p?'selected':''}>${x.name} (${x.id})</option>`).join('')}</select></p>${card(p)}<div class="card" style="margin-top:16px"><b>Heart-rate trend (last 14 readings)</b>${spark(p.hist)}</div><div class="flag"><b>Contributing factors:</b> ${why(p)}</div>`},
3(){const L=pts.filter(p=>p.status=='CRITICAL'||p.status=='HIGH');return `<h1>Caregiver Portal</h1><p class="s">Each patient has two caregivers. Acknowledge alerts to stop auto-escalation.</p><div class="grid">${L.map(p=>`<div class="card"><b>${p.name}</b> <span class="badge ${p.status}">${p.status}</span><p class="mut">Primary: ${p.cg1}<br>Secondary: ${p.cg2}</p><p>${why(p)}</p><button class="btn p" ${acked[p.id]?'disabled':''} onclick="ackP('${p.id}')">${acked[p.id]?'Acknowledged ✓':'Acknowledge'}</button></div>`).join('')||'<p class="mut">No active alerts.</p>'}</div>`},
4(){return `<h1>Simulation Lab</h1><p class="s">Inject synthetic anomalies and watch the rules respond.</p><button class="btn p" onclick="anom()">⚠ Simulate anomaly</button> <button class="btn" onclick="drift()">Simulate new reading</button>`},
5(){return `<h1>Audit Trail</h1><p class="s">Tamper-evident record of events.</p><div class="card"><table>${log.map(l=>`<tr><td class="mut">${l.t}</td><td>${l.m}</td></tr>`).join('')}</table></div>`},
6(){return `<h1>Risk Model Card</h1><div class="card"><p>Inputs: HR, SpO₂, temperature, systolic BP. Output: NEWS2-style score and bands (Stable 0–2, Moderate 3–4, High 5–6, Critical 7+). Rules are explainable and each flag lists its contributing factors.</p><p class="mut">Thresholds are illustrative; data is synthetic.</p></div>`},
7(){return `<h1>Safety &amp; Limits</h1><div class="card"><p>Synthetic data only. Not a medical device. A deterministic safety floor overrides any ML output, and unacknowledged alerts auto-escalate to the attending physician.</p></div>`}};
const cg={};function C(p){return cg[p.id]=cg[p.id]||{st:'Awaiting',notes:[],a:R(2,30),b:R(40,180)}}

function drift(){pts.forEach(p=>{p.hr+=R(-3,3);p.spo2=Math.min(100,p.spo2+R(-1,1));p.hist.push(p.hr);p.hist.shift();fin(p)});pts.sort((a,b)=>b.news-a.news);addLog('New readings ingested');render()}
function ackP(id){acked[id]=1;addLog('Alert acknowledged for '+id);render()}
const STEPS=['Baseline: all vitals normal','Slow deterioration begins — no single value crosses a hospital threshold yet…','Trend slope detected on heart rate','SpO₂ drifting down','Temperature rising','Multi-parameter rule fires','Risk score recalculated','Caregiver escalation prepared','Alert dispatched'];
function tour(){stopT();let i=0;tourEl.classList.add('on');dots.innerHTML=STEPS.map(()=>'<i></i>').join('');const t=()=>{[...dots.children].forEach((d,k)=>d.classList.toggle('d',k<=i));stp.textContent=`Step ${i+1}/9 · ${STEPS[i]}`;if(i==8){clearInterval(tourT);tourT=null;anom();stp.textContent='Run complete. Press Judge Mode again to replay.'}else i++};t();tourT=setInterval(t,700)}
function stopT(){clearInterval(tourT);tourT=null;tourEl.classList.remove('on')}
const nav=document.getElementById('nav'),pg=document.getElementById('pg'),tourEl=document.getElementById('tour'),dots=document.getElementById('dots'),stp=document.getElementById('stp'),alert_=document.getElementById('alert'),altx=document.getElementById('altx');
document.getElementById('doc').innerHTML=DOCS.map(d=>`<option>${d}</option>`).join('');
document.getElementById('ref').onclick=()=>{gen();alert_.classList.remove('on');siren(0);sel=null;acked={};alerts=[];iotOpenI=null;render()};
document.getElementById('judge').onclick=tour;document.getElementById('thm').onclick=theme;document.getElementById('snd').onclick=function(){snd=!snd;this.textContent=snd?'🔊':'🔇'};document.getElementById('stop').onclick=stopT;document.getElementById('ack').onclick=()=>{alert_.classList.remove('on');siren(0);addLog('Alert acknowledged by doctor')};
/* ---------- IoT failures on the alert page + interactive Restore Network ---------- */
(function(){
 const st=document.createElement('style');
 st.textContent=`#ib{margin-bottom:16px}
#ib .ibx{background:var(--panel);border:1px solid var(--crit);border-left:4px solid var(--crit);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
#ib .ibx b{color:var(--crit)}#ib .ibx .ibl{flex:1;min-width:220px;font-size:14px}
#ib .ibx .btn{padding:7px 12px}
#rb.dim{opacity:.6}#rb.busy{pointer-events:none;opacity:.8}
#rb .bdg{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;background:var(--crit);color:#fff;font-size:12px}
#tst{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:120;max-width:380px;background:var(--panel2);color:var(--tx);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:12px;padding:14px 16px;box-shadow:0 10px 30px #0008;font-size:14px;display:none}
#tst.ok{border-left-color:var(--ok)}#tst.warn{border-left-color:var(--warn)}
#tst .pgb{height:6px;background:var(--line);border-radius:4px;margin-top:10px;overflow:hidden}#tst .pgb i{display:block;height:100%;width:0;background:var(--acc);transition:width .5s}
#tst .tb{margin-top:10px;display:flex;gap:8px}`;
 document.head.appendChild(st);
 const tst=document.createElement('div');tst.id='tst';document.body.appendChild(tst);
 let tT=null;
 window.toast=function(html,kind,ms,actions){clearTimeout(tT);tst.className=kind||'';tst.innerHTML=html+(actions?`<div class='tb'>${actions}</div>`:'');tst.style.display='block';if(ms)tT=setTimeout(()=>{tst.style.display='none'},ms)};
 window.toastClose=()=>{clearTimeout(tT);tst.style.display='none'};

 /* 1. IoT failure alerts are visible to everyone on shift, not only the assigned role */
 const _rel=rel;rel=function(a){return a.iot?!!pts.find(x=>x.id==a.pid):_rel(a)};

 /* 2. Banner on every page + badge on the Caregiver Portal (alert page) tab */
 const FIC={5:'🌐',3:'🔌',4:'🧊',6:'🔋'};
 function iotOpen(){return alerts.filter(a=>a.iot&&!a.res)}
 window.iotBanner=function(){
  const n=pts.filter(p=>p.fault).length,open=iotOpen().length;
  const lab='Caregiver Portal'+(open?' ('+open+')':'');
  if(TABS[3]!=lab){TABS[3]=lab;const e=nav.children[3];if(e)e.textContent=lab}
  let el=document.getElementById('ib');
  if(!n||tab==5){if(el)el.remove();return}
  const parts=[5,3,4,6].map(k=>{const L=pts.filter(p=>p.fault==k);return L.length?FIC[k]+' <b>'+FN[k]+'</b>: '+L.map(p=>p.name.split(' ')[0]).join(', '):''}).filter(Boolean).join(' · ');
  const html=`<div class='ibx'><span style='font-size:20px'>⚠️</span><div class='ibl'><b>${n} device ${n==1?'failure':'failures'}</b> — ${parts}<div class='mut' style='font-size:12px;margin-top:2px'>Affected patients may be unmonitored. These also appear as alerts on the Caregiver Portal.</div></div>${tab==3?'':`<button class='btn p' onclick='tab=3;render()'>View alerts</button>`}<button class='btn' onclick='tab=5;render()'>Open IoT Devices</button></div>`;
  if(!el){el=document.createElement('div');el.id='ib';pg.insertBefore(el,pg.firstChild)}
  if(el.dataset.h!=html){el.innerHTML=html;el.dataset.h=html}
 };
 const _render=render;render=function(){_render();iotBanner();rbUpdate()};
 setInterval(()=>{iotBanner();rbUpdate()},1000);

 /* 3. Restore Network: live label, hint when nothing is offline, step-by-step replay with progress */
 window.rbUpdate=function(){
  const b=document.getElementById('rb');if(!b||b.classList.contains('busy'))return;
  const off=pts.filter(p=>p.fault==5),q=off.reduce((s,p)=>s+dev(p).buf.length,0);
  b.classList.toggle('dim',!off.length);
  b.innerHTML='Restore Network (replay buffer)'+(off.length?`<span class='bdg'>${off.length} offline · ${q} queued</span>`:'');
  b.title=off.length?'Reconnect offline devices and replay their buffered readings':'No device is offline right now';
 };
 let busy=false;
 window.netRestore=function(){
  if(busy)return;
  const off=pts.map((p,i)=>i).filter(i=>pts[i].fault==5);
  if(!off.length){
   toast(`<b>No devices are offline.</b><br>Restore Network replays readings that devices saved while the Wi-Fi was down. It becomes active when a device loses its network.`,'warn',7000,`<button class='btn' onclick='toastClose()'>Dismiss</button>`);
   return}
  busy=true;const b=document.getElementById('rb');if(b)b.classList.add('busy');
  let done=0,total=0;const S=off.length;
  toast(`<b>Restoring network…</b><div id='tm' class='mut'>Connecting ${S} device${S>1?'s':''}</div><div class='pgb'><i id='tp'></i></div>`,'',0);
  const step=()=>{
   if(done>=S){
    busy=false;if(iotF==5)iotF=null;render();
    toast(`✅ <b>Network restored</b><br>${S} device${S>1?'s':''} reconnected and <b>${total}</b> buffered reading${total==1?'':'s'} replayed in order. Related alerts were resolved.`,'ok',8000,`<button class='btn' onclick='toastClose()'>OK</button>`);
    return}
   const i=off[done],p=pts[i],n=dev(p).buf.length;
   const m=document.getElementById('tm'),bar=document.getElementById('tp');
   if(m)m.textContent='Replaying '+n+' buffered readings from '+p.name+' ('+(done+1)+'/'+S+')…';
   if(bar)bar.style.width=Math.round((done+.6)/S*100)+'%';
   setTimeout(()=>{total+=n;iotReconnect(i);done++;if(bar)bar.style.width=Math.round(done/S*100)+'%';setTimeout(step,450)},650)};
  step()};
})();

/* ---------- Full-screen alert for IoT device failures (same style as the critical patient alert) ---------- */
(function(){
 const _ov=ov;
 ov=function(){
  const e=document.getElementById('ov');
  if(alerts.some(x=>!x.ack&&x.sev=='CRITICAL'&&x.pop))return _ov();
  const a=alerts.find(x=>x.iot&&x.pop&&!x.ack&&!x.res);
  if(!a){ovk='';e.style.display='none';return}
  if(!a.id)a.id=++AID;
  const k='iot|'+a.id+'|'+(a.e2||0)+'|'+(a.e3||0);
  if(k==ovk&&e.style.display!='none')return;const fresh=!ovk.startsWith('iot|'+a.id+'|');ovk=k;
  const p=pts.find(x=>x.id==a.pid);if(!p){e.style.display='none';return}
  if(fresh)siren(1);
  const f=p.cg1.split(' ')[0],g=p.cg2.split(' ')[0],inf=a.sev=='INFO',E=a.esc&&isFinite(a.esc)?a.esc:null,s=E?Math.max(0,Math.ceil((E-Date.now())/1000)):0;
  const line=inf?`Notified: ${f} — signal-quality notice, no escalation`:`Notified: ${f} — ${a.e2?`escalated to ${g}${a.e3?' and '+p.doc:''}`:`auto-escalates to ${g} in <span class='cd' data-e='${E}'>${s}</span>s`}`;
  const sub=a.items&&a.items[0]?a.items[0]:'';
  e.style.cssText='position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#7a1515cc,#2a0606f0);padding:16px;overflow:auto';
  e.innerHTML=`<div style='background:#100f1a;color:#fff;border:2px solid #fff;border-radius:26px;padding:30px;max-width:780px;text-align:center'><div style='font-size:56px'>🚨</div><h1 style='font-size:clamp(28px,6vw,54px);margin:6px 0 14px'>DEVICE FAILURE ALERT</h1><span style='background:#fff;color:#8b1a1a;font-weight:700;border-radius:20px;padding:6px 14px'>${p.name} (${p.id} — ${p.bed})</span><p style='font-size:20px;font-weight:600'>${a.title}</p>${sub?`<p style='color:#cfd6ea;margin-top:-6px'>${sub}</p>`:''}<p style='color:#f5c2c2'>${line}</p><button class='btn' style='background:#fff;color:#8b1a1a;font-size:17px;padding:14px 22px' onclick='iotAck(${a.id})'>ACKNOWLEDGE as ${dn()}</button> <button class='btn' style='background:#1f2d52;color:#fff' onclick='muteS()'>Mute Siren 🔇</button></div>`};
 window.iotAck=function(id){
  const a=byId(id);if(!a)return;const p=pts.find(x=>x.id==a.pid);
  alerts.filter(x=>x.iot&&x.pid==a.pid&&!x.ack&&!x.res).forEach(x=>{x.ack=Date.now();x.by=dn();x.tA=el(x)});
  siren(0);addLog(p.name+': device alert acknowledged by '+dn(),p.id,dn(),'alert_ack');render();ov()};
 setInterval(()=>{
  alerts.forEach(a=>{if(a.iot&&a.pop==null&&!a.ack&&!a.res){a.pop=1;sideNote(a)}});
  ov();
  document.querySelectorAll('#ov .cd').forEach(c=>{c.textContent=Math.max(0,Math.ceil((c.dataset.e-Date.now())/1000))})},500);
})();

/* ---------- Resolve & restore: loading -> connected ---------- */
(function(){
 const st=document.createElement('style');
 st.textContent=`.sp{display:inline-block;width:12px;height:12px;margin-right:8px;vertical-align:-2px;border:2px solid #06222a55;border-top-color:#06222a;border-radius:50%;animation:spn .8s linear infinite}@keyframes spn{to{transform:rotate(360deg)}}`;
 document.head.appendChild(st);
 const upd=()=>{const e=document.getElementById('iotb');if(e&&!pd&&!(document.activeElement&&document.activeElement.tagName=='SELECT'))e.innerHTML=iotBody(sel??0)};
 window.iotFix=function(i){
  const p=pts[i];if(!p||FX[p.id])return;
  const d=dev(p),out=p.fault==5,n=d.buf.length,a=alerts.find(y=>y.pid==p.id&&y.iot&&!y.res);
  FX[p.id]={b:out?'RECONNECTING…':'RESTORING…',t:out?'Connecting…':'Restoring…'};upd();
  const steps=out?6:4;let k=0;
  const t=setInterval(()=>{
   k++;
   if(out&&k>=2){const left=Math.max(0,Math.round(n*(1-(k-1)/(steps-1))));FX[p.id].t='Replaying '+left+' of '+n+'…'}
   if(k>=steps){
    clearInterval(t);delete FX[p.id];
    if(out||!a)iotReconnect(i);else resA(a.id);
    toast('✅ <b>'+p.name+'</b> is connected'+(out?'<br>'+n+' buffered reading'+(n==1?'':'s')+' replayed in order.':'.'),'ok',5000,"<button class='btn' onclick='toastClose()'>OK</button>");
    render();
   }else upd()},450)};
})();


(function(){
 const st=document.createElement('style');
 st.textContent=`#sn{position:fixed;right:16px;top:calc(16px + env(safe-area-inset-top,0px));z-index:130;display:flex;flex-direction:column;gap:10px;max-width:340px}
#sn .n{background:#fff;color:#1a1a2e;border-left:5px solid var(--crit);border-radius:12px;padding:12px 14px;box-shadow:0 10px 30px #0006;font-size:14px;animation:snin .25s ease-out}
#sn .n b{display:block;margin-bottom:2px}#sn .n .m{color:#55607a;font-size:12px}
#sn .n button{margin-top:8px;margin-right:6px;border:0;border-radius:8px;padding:6px 10px;font-weight:600;cursor:pointer;background:#e5484d;color:#fff}
#sn .n button.g{background:#e8ecf5;color:#1a1a2e}@keyframes snin{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}`;
 document.head.appendChild(st);
 const box=document.createElement('div');box.id='sn';document.body.appendChild(box);
 window.sideNote=function(a){
  const p=pts.find(x=>x.id==a.pid);if(!p)return;
  const n=document.createElement('div');n.className='n';
  n.innerHTML='<b>🚨 '+(a.title||'Device failure')+'</b><div class="m">'+p.name+' · '+p.id+' · '+p.bed+'</div><button>View alerts</button><button class="g">Dismiss</button>';
  const bs=n.querySelectorAll('button');
  bs[0].onclick=()=>{n.remove();tab=3;render()};bs[1].onclick=()=>n.remove();
  box.appendChild(n);while(box.children.length>4)box.firstChild.remove();
  setTimeout(()=>n.remove(),12000)};
})();
function iotGenAll(){
 const free=pts.map((p,i)=>i).filter(i=>!pts[i].fault).sort(()=>Math.random()-.5);
 if(!free.length){toast('All devices already have a fault. Resolve some first.','warn',4000);return}
 const types=[5,3,4,6].sort(()=>Math.random()-.5).slice(0,Math.min(free.length,R(1,4)));
 types.forEach(k=>{const i=free.shift();trig(i,k);sel=i});
 alert_.classList.remove('on');iotF=null;iotTick();render()}

function tick(){const c=document.getElementById('clk');c.firstChild.textContent=now().replace(' IST','')+' ';}
setInterval(tick,1000);tick();gen();render();
